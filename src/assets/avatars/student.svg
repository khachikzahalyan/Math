<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Student avatar">
  <defs>
    <linearGradient id="studentBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="studentShirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="studentClip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <g clip-path="url(#studentClip)">
    <rect width="200" height="200" fill="url(#studentBg)"/>

    <!-- shirt / body -->
    <path d="M30 210 Q30 150 100 145 Q170 150 170 210 Z" fill="url(#studentShirt)"/>
    <path d="M85 148 L100 168 L115 148 Z" fill="#ffffff" opacity="0.85"/>

    <!-- neck -->
    <rect x="92" y="132" width="16" height="14" rx="4" fill="#f4d4b0"/>

    <!-- head -->
    <circle cx="100" cy="100" r="38" fill="#fce4c4"/>

    <!-- hair -->
    <path d="M62 95 Q60 60 100 58 Q140 60 138 95 Q132 78 118 76 Q105 88 90 76 Q72 80 62 95 Z" fill="#3730a3"/>

    <!-- ears -->
    <circle cx="62" cy="102" r="6" fill="#fce4c4"/>
    <circle cx="138" cy="102" r="6" fill="#fce4c4"/>

    <!-- eyes -->
    <ellipse cx="86" cy="102" rx="3.5" ry="4.5" fill="#1e1b4b"/>
    <ellipse cx="114" cy="102" rx="3.5" ry="4.5" fill="#1e1b4b"/>
    <circle cx="87" cy="100.5" r="1.2" fill="#ffffff"/>
    <circle cx="115" cy="100.5" r="1.2" fill="#ffffff"/>

    <!-- cheeks -->
    <circle cx="78" cy="115" r="5" fill="#f9a8a0" opacity="0.55"/>
    <circle cx="122" cy="115" r="5" fill="#f9a8a0" opacity="0.55"/>

    <!-- smile -->
    <path d="M88 118 Q100 128 112 118" stroke="#1e1b4b" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- pencil -->
    <g transform="rotate(-18 150 175)">
      <rect x="138" y="168" width="32" height="7" rx="1.5" fill="#fde68a"/>
      <rect x="138" y="168" width="6" height="7" fill="#f87171"/>
      <polygon points="170,168 178,171.5 170,175" fill="#1e293b"/>
    </g>
  </g>
</svg>
